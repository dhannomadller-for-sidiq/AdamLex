name: Daily High Court Case Sync

on:
  schedule:
    # 7:00 PM IST is 1:30 PM UTC
    - cron: '30 13 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync API
        run: |
          curl -X GET "https://${{ secrets.VERCEL_PROJECT_URL }}/api/cron/sync-advocate-cases?key=${{ secrets.CRON_SECRET }}"
